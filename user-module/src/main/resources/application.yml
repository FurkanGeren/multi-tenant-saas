server:
  port: 8081


spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/db_multi_tenant
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
        multi_tenant_connection_provider: org.saas.core.tenant.SchemaBasedMultiTenantConnectionProvider
        current_tenant_identifier_resolver: org.saas.core.tenant.SchemaTenantIdentifierResolver
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000