server:
    port: 8090

spring:
    datasource:
        url: jdbc:postgresql://localhost:5433/db_multi_tenant
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    autoconfigure:
        exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                multiTenancy: SCHEMA
                multi_tenant_connection_provider: org.saas.core.tenant.SchemaBasedMultiTenantConnectionProvider
                current_tenant_identifier_resolver: org.saas.core.tenant.SchemaTenantIdentifierResolver

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest

